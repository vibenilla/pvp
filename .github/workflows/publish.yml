name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Add execute permissions for gradlew
        run: chmod +x gradlew

      - name: Determine version
        id: version
        run: |
          VERSION=$(./gradlew properties --quiet --console=plain --no-configuration-cache | sed -n 's/^version: //p' | tail -n 1)
          if [ -z "$VERSION" ] || [ "$VERSION" = "unspecified" ]; then
            echo "Could not determine project version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Compile tests and assemble
        run: ./gradlew compileTestJava assemble --no-configuration-cache

      - name: Publish to Skylite Maven
        run: ./gradlew publishAllPublicationsToSkyliteRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_skyliteUsername: ${{ secrets.SKYLITE_USERNAME }}
          ORG_GRADLE_PROJECT_skylitePassword: ${{ secrets.SKYLITE_PASSWORD }}

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git tag --list "$VERSION" | grep -Fxq "$VERSION"; then
            echo "Tag $VERSION already exists."
            exit 1
          fi
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update installation versions
        uses: vibenilla/actions/update-version-numbers@main
        with:
          artifact: pvp
          version: ${{ steps.version.outputs.version }}
          docs_token: ${{ secrets.DOCS_REPO_TOKEN }}
