name: Publish

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Add execute permissions for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Publish to Skylite Maven
        run: ./gradlew publishAllPublicationsToSkyliteRepository --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_skyliteUsername: ${{ secrets.SKYLITE_USERNAME }}
          ORG_GRADLE_PROJECT_skylitePassword: ${{ secrets.SKYLITE_PASSWORD }}

      - name: Upload JARs to Release
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            build/libs/*.jar \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
